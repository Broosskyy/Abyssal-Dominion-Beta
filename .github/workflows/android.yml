name: Legacy M3051 Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy/m3051/project.godot'
      - 'legacy/m3051/export_presets.cfg'
      - 'legacy/m3051/scripts/**'
      - 'legacy/m3051/scenes/**'
      - 'legacy/m3051/assets/**'
      - 'legacy/m3051/tools/build_android.py'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Godot and matching export template
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Abyssal Dominion,C=DE'
      - name: Build and verify
        working-directory: legacy/m3051
        run: python3 tools/build_android.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --android-sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --debug-keystore /tmp/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: Abyssal-Dominion-M3051-Android-ARM64-Test
          path: legacy/m3051/builds/android/ABYSSAL_DOMINION_M3051_ARM64_TEST.*
          if-no-files-found: error
          retention-days: 14
