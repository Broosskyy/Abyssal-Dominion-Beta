name: Abyssal Dominion – browser preview
on:
  workflow_dispatch:
  push:
    branches: [main, feature/classic-seafight-navigation-330, fix/classic-4way-small-step-navigation-334, fix/classic-four-view-visual-only-335, fix/classic-left-right-sailing-336, fix/classic-framing-scale-337, fix/classic-pixel-hull-only-dither-341, fix/classic-mobile-scale-fourway-stall-339, fix/classic-heading-render-phase-341, fix/classic-tick-raster-interpolation-342, fix/classic-straight-world-course-343, experiment/classic-iso-tile-grid-344]
    paths:
      - 'rebuild/m3052/**'
      - 'server/**'
      - 'web_preview/build.py'
      - '.github/workflows/browser-preview.yml'

concurrency:
  group: abyssal-browser-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Export first playable HTML5 beta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rebuild/m3052
            server
            web_preview/tests
      - name: Verify mobile browser launch and fullscreen
        run: |
          npm install --prefix /tmp/abyssal-browser-check playwright@1.62.1 --no-save
          NODE_PATH=/tmp/abyssal-browser-check/node_modules CHROMIUM_PATH=/usr/bin/google-chrome node web_preview/tests/mobile_shell.cjs
      - name: Install verified Godot 4.7.2 and Web export template
        shell: bash
        run: |
          set -euo pipefail
          fetch_pinned() {
            local output="$1" digest="$2" filename="$3"
            for base in \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable" \
              "https://downloads.sourceforge.net/project/godot-engine.mirror/4.7.2-stable"; do
              rm -f "$output"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 1800 -o "$output" "$base/$filename" &&
                 printf '%s  %s\n' "$digest" "$output" | sha256sum -c -; then return 0; fi
            done
            echo "::error::Pinned Godot download or signature check failed"
            return 1
          }
          fetch_pinned /tmp/godot.zip cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fetch_pinned /tmp/templates.tpz f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011 Godot_v4.7.2-stable_export_templates.tpz
          tpl="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$tpl"
          # The existing Web export preset disables threads. Godot 4.7.2
          # therefore requires BOTH web_nothreads templates, not web_release.
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > "$tpl/web_nothreads_release.zip"
          unzip -p /tmp/templates.tpz templates/web_nothreads_debug.zip > "$tpl/web_nothreads_debug.zip"
          test -s "$tpl/web_nothreads_release.zip"
          test -s "$tpl/web_nothreads_debug.zip"
          unzip -p /tmp/templates.tpz templates/version.txt > "$tpl/version.txt"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import resources and export Godot WebGL2 build
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p rebuild/m3052/builds/web
          # First import EVERY approved original GLB. Generate real 8-view
          # sprite atlases in the CI build machine (OpenGL llvmpipe/Xvfb).
          # The 3D assets will be stripped from the browser export below.
          "$engine" --headless --path rebuild/m3052 --editor --import --quit > /tmp/glb-import.log 2>&1 || { tail -100 /tmp/glb-import.log; exit 1; }
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args='-screen 0 1280x720x24' \
            "$engine" --audio-driver Dummy --path rebuild/m3052 \
            --script tools/bake_web_fleet.gd > /tmp/bake-glb-sprites.log 2>&1 || {
              tail -160 /tmp/bake-glb-sprites.log; exit 1;
            }
          tail -25 /tmp/bake-glb-sprites.log
          grep -q 'WEB_SPRITES_READY.*"status":"PASS"' /tmp/bake-glb-sprites.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('rebuild/m3052/assets/classic_baked')
          doc=json.loads((root/'manifest.json').read_text())
          assert doc['status']=='BAKED_FROM_ORIGINAL_GLBS'
          assert doc['angles']==8 and doc['frame_px']==256
          assert len(doc['atlases'])==23, '11 original GLBs + 10 Elite + 2 event paints'
          for item in doc['atlases']:
              png=root/(item['name']+'.png')
              assert png.stat().st_size>4000, f'missing original 3D render: {png}'
              assert len(item['coverage'])==8 and min(item['coverage'])>15
              assert len(item['frames'])==8 and item['reference_extent']>0
              for frame in item['frames']:
                  assert len(frame['rect'])==4 and min(frame['rect'][2:])>0
                  assert len(frame['pivot'])==2 and frame['reference_extent']==item['reference_extent']
          print('PASS: 23 actual GLB-derived atlases / 184 distinct heading renders')
          PY
          "$engine" --headless --path rebuild/m3052 --editor --import --quit > /tmp/sprites-import.log 2>&1 || { tail -100 /tmp/sprites-import.log; exit 1; }
          # Verify real 48x32 diagonal Classic world movement, screen geometry and
          # unchanged native 2.5D/3D navigation before stripping Web-only assets.
          for suite in classic_mode_test classic_navigation_test navigation_test simulation_test ui_test; do
            XDG_DATA_HOME="$(mktemp -d)" "$engine" --headless --path rebuild/m3052 \
              --script "tests/${suite}.gd" > "/tmp/${suite}.log" 2>&1 || {
                tail -120 "/tmp/${suite}.log"; exit 1;
              }
            tail -35 "/tmp/${suite}.log"
            grep -q '"status":"PASS"' "/tmp/${suite}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "/tmp/${suite}.log"; then exit 1; fi
          done
          # Web-only imports, art exclusions and streaming autoload. Native
          # presets/project are never modified in the signed Android job.
          python3 rebuild/m3052/tools/web_delivery.py prepare
          "$engine" --headless --path rebuild/m3052 --editor --import --quit > /tmp/web-art-import.log 2>&1 || { tail -100 /tmp/web-art-import.log; exit 1; }
          "$engine" --headless --path rebuild/m3052 --script tests/browser_geometry_test.gd
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args='-screen 0 1280x720x24' \
            "$engine" --audio-driver Dummy --path rebuild/m3052 \
            --script tests/browser_capture.gd -- --out="$RUNNER_TEMP/browser-captures"
          "$engine" --headless --path rebuild/m3052 --export-release Web "$PWD/rebuild/m3052/builds/web/index.html" > /tmp/web-export.log 2>&1 || { tail -100 /tmp/web-export.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/web-export.log; then exit 1; fi
          "$engine" --headless --path rebuild/m3052 --export-pack Web "$PWD/rebuild/m3052/builds/web/full.zip" > /tmp/web-pack.log 2>&1 || { tail -100 /tmp/web-pack.log; exit 1; }
          python3 rebuild/m3052/tools/web_delivery.py finalize
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('rebuild/m3052/builds/web')
          report=json.loads((root/'delivery-report.json').read_text())
          assert report['core_zip_bytes']<12000000, 'browser core size regression'
          assert report['initial_gzip_estimate_bytes']<23000000, 'cold start budget regression'
          for name in ['index.html',*report['start_files']]:assert (root/name).stat().st_size>0
          PY
      - name: Verify complete ship catalog in startup core
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$RUNNER_TEMP/isolated-browser-core"
          core=$(find "$PWD/rebuild/m3052/builds/web" -name 'core-*.zip' -print -quit)
          timeout 60 "$engine" --headless --path "$RUNNER_TEMP/isolated-browser-core" --main-pack "$core" --script "$PWD/rebuild/m3052/tests/browser_delivery_test.gd"
      - name: Verify real WebGL startup and cached catalog
        run: |
          NODE_PATH=/tmp/abyssal-browser-check/node_modules CHROMIUM_PATH=/usr/bin/google-chrome node web_preview/tests/streaming_game.cjs
      - name: Package downloadable browser build
        run: |
          set -euo pipefail
          cd rebuild/m3052/builds/web
          zip -q -r ../ABYSSAL_BROWSER_${GITHUB_RUN_NUMBER}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-browser-visual-check-${{ github.run_number }}
          path: ${{ runner.temp }}/browser-captures/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-browser-${{ github.run_number }}
          path: rebuild/m3052/builds/web/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-browser-zip-${{ github.run_number }}
          path: rebuild/m3052/builds/ABYSSAL_BROWSER_${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish browser test package
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Feature branches must emit the validated release marker as their own
      # second commit, so Vercel deploys only after the Godot export succeeds.
      - uses: actions/checkout@v4
        if: github.ref != 'refs/heads/main'
        with:
          sparse-checkout: |
            web_preview
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: abyssal-browser-zip-${{ github.run_number }}
          path: ./dist
      - name: Publish uniquely versioned browser prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REV: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "browser-test-${REV}" "dist/ABYSSAL_BROWSER_${REV}.zip" \
            --repo "$REPO" --target "${GITHUB_SHA}" --prerelease \
            --title "Abyssal Dominion – Browser-Test ${REV}" \
            --notes "HTML5/WebGL2 guest preview of Abyssal Dominion. Download ZIP and host via HTTP(S); double-clicking index.html from a local file is not supported. Browser login needs an external HTTPS/WSS presence server; local guest gameplay is available without one."
      - name: Notify Vercel when tested branch export is ready
        if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          REV: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # No game files change in this follow-up commit. The remote source
          # SHA in the release is the tested commit, not this marker commit.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("web_preview/export-ready.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "source_sha": os.environ["SOURCE_SHA"],
              "release": "browser-test-" + os.environ["REV"],
              "branch": os.environ["GITHUB_REF_NAME"],
          }, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_preview/export-ready.json
          git commit -m "chore(browser): verified preview export ${REV} [skip ci]"
          # A concurrent source update must not be overwritten: in that case
          # the new push will run its own export workflow.
          git -c pack.window=0 push origin "HEAD:${GITHUB_REF_NAME}"

  pages:
    name: Deploy playable GitHub Pages test
    needs: web
    runs-on: ubuntu-24.04
    # GitHub Pages must first be enabled in repo Settings -> Pages, source GitHub Actions.
    # Keep the standalone browser build available even before that setting is enabled.
    if: vars.ABYSSAL_PAGES_ENABLED == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: abyssal-browser-${{ github.run_number }}
          path: ./dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
