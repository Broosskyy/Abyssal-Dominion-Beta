name: M3059 signed content updates and sea movement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild/m3052/**'
      - 'server/**'
      - '.github/workflows/m3052.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rebuild/m3052
            updates
            server
            .github/workflows
          fetch-depth: 1
      - name: Plan native versus content release
        id: plan
        run: python3 rebuild/m3052/tools/release_plan.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'platforms;android-36'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/abyssal-test-signing
          key: m3052-private-debug-signing-v1
      - name: Install engine and prepare pinned content signing
        env:
          ABYSSAL_ANDROID_KEYSTORE_BASE64: ${{ secrets.ABYSSAL_ANDROID_KEYSTORE_BASE64 }}
          ABYSSAL_CONTENT_SIGNING_KEY: ${{ secrets.ABYSSAL_CONTENT_SIGNING_KEY }}
          SHELL_NEEDED: ${{ steps.plan.outputs.shell_needed }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release assets may return HTTP 504. Pin SHA256 and fail over to
          # SourceForge's mirrored *same* upstream Godot release, never to a new engine.
          fetch_pinned() {
            local output="$1" digest="$2" filename="$3"
            for base in \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable" \
              "https://downloads.sourceforge.net/project/godot-engine.mirror/4.7.2-stable"; do
              rm -f "$output"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 1800 -o "$output" "$base/$filename" &&
                printf '%s  %s\n' "$digest" "$output" | sha256sum -c -; then
                return 0
              fi
              echo "::warning::Failed verified download from $base; trying the next upstream mirror."
            done
            echo "::error::Could not download or verify $filename from either source."
            return 1
          }
          fetch_pinned /tmp/godot.zip cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fetch_pinned /tmp/templates.tpz f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011 Godot_v4.7.2-stable_export_templates.tpz
          tpl="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$tpl" "$HOME/.cache/abyssal-test-signing"
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$tpl/android_debug.apk"
          if [ -z "$ABYSSAL_ANDROID_KEYSTORE_BASE64" ]; then echo '::warning::Signing keystore comes only from the Actions cache; store it in the ABYSSAL_ANDROID_KEYSTORE_BASE64 secret (docs/SIGNING.md).'; fi
          if [ -n "$ABYSSAL_ANDROID_KEYSTORE_BASE64" ]; then
            python3 -c 'import os,base64,pathlib; pathlib.Path.home().joinpath(".cache/abyssal-test-signing/debug.keystore").write_bytes(base64.b64decode(os.environ["ABYSSAL_ANDROID_KEYSTORE_BASE64"],validate=True))'
          fi
          signing="$HOME/.cache/abyssal-test-signing/debug.keystore"
          test -f "$signing" || { echo 'Original signing key unavailable; refusing replacement.'; exit 1; }
          keytool -exportcert -alias androiddebugkey -keystore "$signing" -storepass android -file /tmp/certificate.der
          test "$(sha256sum /tmp/certificate.der | cut -d' ' -f1)" = 278a2899340d58b3db0aced5e0f306ebb121550bc34dc1e6948783424652fe3b
          if [ -n "$ABYSSAL_CONTENT_SIGNING_KEY" ]; then
            # Dedicated data-pack key (docs/SIGNING.md). Changes data_public.pem, so release_plan demands a new bootstrap APK.
            printf '%s\n' "$ABYSSAL_CONTENT_SIGNING_KEY" > /tmp/content-private.pem
          else
            keytool -importkeystore -srckeystore "$signing" -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/content-signing.p12 -deststoretype PKCS12 -deststorepass android -noprompt
            openssl pkcs12 -in /tmp/content-signing.p12 -nocerts -nodes -passin pass:android -out /tmp/content-private.pem
          fi
          chmod 600 /tmp/content-private.pem
          openssl pkey -in /tmp/content-private.pem -pubout -out rebuild/m3052/updater/data_public.pem
          if ! git diff --quiet -- rebuild/m3052/updater/data_public.pem && [ "$SHELL_NEEDED" != true ]; then
            echo '::error::Data signing key changed: installed apps would reject every data pack. Bump VERSION_CODE so a new bootstrap APK ships the new public key.'; exit 1
          fi
          if [ "$SHELL_NEEDED" = true ]; then
            unzip -p /tmp/templates.tpz templates/android_source.zip > "$tpl/android_source.zip"
            unzip -p /tmp/templates.tpz templates/version.txt > "$tpl/version.txt"
            mkdir -p rebuild/m3052/android/build
            unzip -q "$tpl/android_source.zip" -d rebuild/m3052/android/build
            touch rebuild/m3052/android/build/.gdignore
            echo '4.7.2.stable' > rebuild/m3052/android/.build_version
            python3 rebuild/m3052/tools/android_updater/inject_bridge.py rebuild/m3052/android/build
            chmod +x rebuild/m3052/android/build/gradlew
            # Both services.gradle.org and downloads.gradle.org currently redirect
            # to the broken GitHub 504 endpoint. Verify a mirror ZIP and use the
            # file:// URL so Gradle Wrapper never depends on that redirect.
            wrapper=rebuild/m3052/android/build/gradle/wrapper/gradle-wrapper.properties
            grep -q 'gradle-8.11.1-bin.zip' "$wrapper"
            gradle_zip="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
            gradle_sha=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
            gradle_ok=false
            for source in \
              "https://distfiles.macports.org/gradle/gradle-8.11.1-bin.zip" \
              "https://mirror.math.princeton.edu/pub/macports/distfiles/gradle/gradle-8.11.1-bin.zip" \
              "https://ftp.fau.de/macports/distfiles/gradle/gradle-8.11.1-bin.zip" \
              "https://mirror.nju.edu.cn/gradle/gradle-8.11.1-bin.zip"; do
              rm -f "$gradle_zip"
              if curl -fL --retry 1 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 120 --speed-limit 102400 --speed-time 20 -o "$gradle_zip" "$source" &&
                printf '%s  %s\n' "$gradle_sha" "$gradle_zip" | sha256sum -c -; then
                gradle_ok=true
                break
              fi
              echo "::warning::Gradle mirror unavailable or invalid: $source"
            done
            if [ "$gradle_ok" != true ]; then echo '::error::Gradle 8.11.1 unavailable from verified mirrors'; exit 1; fi
            sed -i "s#^distributionUrl=.*#distributionUrl=file://$gradle_zip#" "$wrapper"
            grep -q '^distributionSha256Sum=' "$wrapper" || printf '\ndistributionSha256Sum=%s\n' "$gradle_sha" >> "$wrapper"
          fi
      - name: Test account and crossplay preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r server/requirements.txt
          python3 -m unittest discover -s server -v
          ABYSSAL_DATABASE="$RUNNER_TEMP/crossplay-test.sqlite3" python3 server/world_server.py > "$RUNNER_TEMP/world-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 -c 'import socket,time; time.sleep(1); socket.create_connection(("127.0.0.1",8787),timeout=5).close()'
          XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --script tests/network_client_test.gd > "$RUNNER_TEMP/network-client.log" 2>&1
          cat "$RUNNER_TEMP/network-client.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|"status":"FAIL"' "$RUNNER_TEMP/network-client.log"; then exit 1; fi
      - name: Test game, signed data pack and optional native APK
        env:
          SHELL_NEEDED: ${{ steps.plan.outputs.shell_needed }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$SHELL_NEEDED" = false ]; then extra+=(--content-only); fi
          # The original Meshy geometry must NEVER be decimated or index-patched
          # during APK/data builds. Only validate intact geometry in CI.
          python3 rebuild/m3052/tools/validate_meshy_geometry.py --warn-only
          python3 rebuild/m3052/tools/build_android.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --keystore "$HOME/.cache/abyssal-test-signing/debug.keystore" --output "$GITHUB_WORKSPACE/releases/M3059/ABYSSAL_DOMINION_M3059_REBUILD_ARM64.apk" --data-output "$GITHUB_WORKSPACE/releases/M3059/ABYSSAL_DATA_${GITHUB_RUN_NUMBER}.zip" --revision "$GITHUB_RUN_NUMBER" --signing-key /tmp/content-private.pem "${extra[@]}"
          if [ "$SHELL_NEEDED" = true ]; then
            python3 rebuild/m3052/tools/prepare_update_manifest.py releases/M3059/ABYSSAL_DOMINION_M3059_REBUILD_ARM64.apk
          fi
      # Full visual recording should not indefinitely block signed content-only
      # updates. The headless game, regression tests, signed PCK and verification
      # have already passed in the preceding mandatory step.
      - name: Capture actual renderer and movement
        if: steps.plan.outputs.shell_needed == 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p releases/M3059/captures
          for script in capture_updater sea_foundation_capture hud_portal_capture frontier_capture; do
            XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a --server-args='-screen 0 2340x1080x24' /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --script "tests/$script.gd" -- --out="$GITHUB_WORKSPACE/releases/M3059/captures/$script" > "releases/M3059/captures/$script.log" 2>&1 || { cat "releases/M3059/captures/$script.log"; exit 1; }
            cat "releases/M3059/captures/$script.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "releases/M3059/captures/$script.log"; then exit 1; fi
          done
          ffmpeg -y -hide_banner -loglevel error -framerate 10 -i releases/M3059/captures/sea_foundation_capture/motion_%03d.png -c:v libx264 -crf 25 -pix_fmt yuv420p -movflags +faststart releases/M3059/captures/sea_foundation_capture/legacy_zigzag.mp4
          rm releases/M3059/captures/sea_foundation_capture/motion_*.png
          for scene in combat harbor damage; do
            XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --fixed-fps 60 --script tests/capture_scene.gd -- --out="$GITHUB_WORKSPACE/releases/M3059/captures/$scene" "--$scene" > "releases/M3059/captures/$scene.log" 2>&1 || { cat "releases/M3059/captures/$scene.log"; exit 1; }
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "releases/M3059/captures/$scene.log"; then exit 1; fi
          done
          ffmpeg -y -hide_banner -loglevel error -framerate 20 -i releases/M3059/captures/damage/motion_%03d.png -c:v libx264 -crf 28 -pix_fmt yuv420p releases/M3059/captures/damage/health_state_change.mp4
          rm releases/M3059/captures/damage/motion_*.png
      - name: Capture compact renderer evidence for signed content-only updates
        if: steps.plan.outputs.shell_needed == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/M3059/captures
          XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a --server-args='-screen 0 2340x1080x24' /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --script tests/frontier_capture.gd -- --out="$GITHUB_WORKSPACE/releases/M3059/captures/frontier_capture" > releases/M3059/captures/frontier_capture.log 2>&1
          cat releases/M3059/captures/frontier_capture.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' releases/M3059/captures/frontier_capture.log; then exit 1; fi
          printf 'Content-only release: all Godot regression and signed-data-pack tests passed. Sixteen actual renderer views include two animation phase pairs.\nCommit: %s\n' "$GITHUB_SHA" > releases/M3059/captures/content_validation.log
      - uses: actions/upload-artifact@v4
        with:
          name: Abyssal-Dominion-M3059-${{ github.run_number }}
          path: releases/M3059/
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_NEEDED: ${{ steps.plan.outputs.shell_needed }}
          SHELL_CODE: ${{ steps.plan.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo 'Newer source exists; preserving artifact without publishing stale update.'; exit 0; fi
          if [ "$SHELL_NEEDED" = true ]; then
            cp releases/M3059/ABYSSAL_DOMINION_M3059_REBUILD_ARM64.apk "$RUNNER_TEMP/ABYSSAL_DOMINION_${SHELL_CODE}.apk"
            gh release create "abyssal-${SHELL_CODE}-android" "$RUNNER_TEMP/ABYSSAL_DOMINION_${SHELL_CODE}.apk" releases/M3059/latest.json --target "$GITHUB_SHA" --title 'Abyssal Dominion: updater recovery, events and sea monsters' --notes 'Recovery APK for interrupted game-data downloads. Adds an independent in-app transfer with bounded retries, stalled-download handling and explicit error codes; signed package checks remain required. Includes the complete current game: organized menus and Back navigation, three configurable quickbars, new sea creatures, Halloween/Columbus designs and collectibles. Same app package and signing certificate: install over the existing app to retain captain progress. Do not uninstall first.' --prerelease
            curl -fL --retry 3 -o "$RUNNER_TEMP/served.apk" "https://github.com/Broosskyy/Abyssal-Dominion-Beta/releases/download/abyssal-${SHELL_CODE}-android/ABYSSAL_DOMINION_${SHELL_CODE}.apk"
            python3 -c 'import json,hashlib,pathlib,os; s=json.loads(pathlib.Path("releases/M3059/latest.json").read_text())["latest"]; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"served.apk"; assert p.stat().st_size==s["bytes"] and hashlib.sha256(p.read_bytes()).hexdigest()==s["sha256"]'
          fi
          # Renderer captures are release evidence, not source: attach them to the release instead of committing ~30 MB of PNG/MP4 per build.
          (cd releases/M3059 && zip -qr9 "$RUNNER_TEMP/ABYSSAL_CAPTURES_${GITHUB_RUN_NUMBER}.zip" captures)
          gh release create "data-${GITHUB_RUN_NUMBER}" "releases/M3059/ABYSSAL_DATA_${GITHUB_RUN_NUMBER}.zip" releases/M3059/data.json "$RUNNER_TEMP/ABYSSAL_CAPTURES_${GITHUB_RUN_NUMBER}.zip" --target "$GITHUB_SHA" --title "Abyssal game data ${GITHUB_RUN_NUMBER}" --notes 'Signed game scripts and assets for the M3059 bootstrap. No Android installation for compatible data updates.' --prerelease
          curl -fL --retry 3 -o "$RUNNER_TEMP/served.zip" "https://github.com/Broosskyy/Abyssal-Dominion-Beta/releases/download/data-${GITHUB_RUN_NUMBER}/ABYSSAL_DATA_${GITHUB_RUN_NUMBER}.zip"
          python3 -c 'import json,hashlib,pathlib,os; s=json.loads(pathlib.Path("releases/M3059/data.json").read_text())["latest"]; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"served.zip"; assert p.stat().st_size==s["bytes"] and hashlib.sha256(p.read_bytes()).hexdigest()==s["sha256"]; print("ANONYMOUS_DATA_DOWNLOAD_VERIFIED")'
          mkdir -p updates
          if [ "$SHELL_NEEDED" = true ]; then cp releases/M3059/latest.json updates/latest.json; fi
          cp releases/M3059/data.json updates/data.json
      - name: Preserve manifests, reports and capture logs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo 'Newer source exists; leaving artifact available.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f rebuild/m3052/assets/npc/meshy/models/*.glb rebuild/m3052/assets/npc/meshy/repair_report.json updates/*.json releases/M3059/*.build.json releases/M3059/data.json releases/M3059/captures/*.log rebuild/m3052/updater/data_public.pem rebuild/m3052/assets/content_version.json
          if [ -f releases/M3059/latest.json ]; then git add --sparse -f releases/M3059/latest.json releases/M3059/*.signature.txt releases/M3059/*.manifest.txt releases/M3059/*.android-xml.txt; fi
          git commit -m 'Preserve signed data release, optional bootstrap and renderer checks [skip ci]'
          git -c pack.window=0 push origin HEAD:main
