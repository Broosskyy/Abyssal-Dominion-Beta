name: M3057 native background updater - Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild/m3052/**'
      - '.github/workflows/m3052.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'platforms;android-36'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/abyssal-test-signing
          key: m3052-private-debug-signing-v1
      - name: Install Godot and development signing key
        env:
          ABYSSAL_ANDROID_KEYSTORE_BASE64: ${{ secrets.ABYSSAL_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$HOME/.cache/abyssal-test-signing"
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          if [ -n "$ABYSSAL_ANDROID_KEYSTORE_BASE64" ]; then
            python3 -c 'import os,base64,pathlib; pathlib.Path.home().joinpath(".cache/abyssal-test-signing/debug.keystore").write_bytes(base64.b64decode(os.environ["ABYSSAL_ANDROID_KEYSTORE_BASE64"],validate=True))'
          fi
          test -f "$HOME/.cache/abyssal-test-signing/debug.keystore" || { echo 'Original signing key unavailable: refusing to generate an incompatible replacement.'; exit 1; }
          tpl="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p /tmp/templates.tpz templates/android_source.zip > "$tpl/android_source.zip"
          unzip -p /tmp/templates.tpz templates/version.txt > "$tpl/version.txt"
          mkdir -p rebuild/m3052/android/build
          unzip -q "$tpl/android_source.zip" -d rebuild/m3052/android/build
          touch rebuild/m3052/android/build/.gdignore
          echo '4.7.2.stable' > rebuild/m3052/android/.build_version
          python3 rebuild/m3052/tools/android_updater/inject_bridge.py rebuild/m3052/android/build
          chmod +x rebuild/m3052/android/build/gradlew
      - name: Test and verify APK
        run: python3 rebuild/m3052/tools/build_android.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --keystore "$HOME/.cache/abyssal-test-signing/debug.keystore" --output "$GITHUB_WORKSPACE/releases/M3057/ABYSSAL_DOMINION_M3057_REBUILD_ARM64.apk"
      - name: Prepare verified update manifest
        run: python3 rebuild/m3052/tools/prepare_update_manifest.py releases/M3057/ABYSSAL_DOMINION_M3057_REBUILD_ARM64.apk
      - name: Capture desktop and mobile gameplay
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p releases/M3057/captures
          XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --script tests/capture_updater.gd -- --out="$GITHUB_WORKSPACE/releases/M3057/captures/updater" > releases/M3057/captures/updater.log 2>&1 || { cat releases/M3057/captures/updater.log; exit 1; }
          cat releases/M3057/captures/updater.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' releases/M3057/captures/updater.log; then exit 1; fi
          for scene in combat harbor maps north maneuver damage; do
            extra=""
            if [ "$scene" = harbor ] || [ "$scene" = maps ]; then extra="--mobile"; fi
            XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --fixed-fps 60 --script tests/capture_scene.gd -- --out="$GITHUB_WORKSPACE/releases/M3057/captures/$scene" "--$scene" $extra > "releases/M3057/captures/$scene.log" 2>&1 || { cat "releases/M3057/captures/$scene.log"; exit 1; }
            cat "releases/M3057/captures/$scene.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "releases/M3057/captures/$scene.log"; then exit 1; fi
            if [ "$scene" = maneuver ] || [ "$scene" = damage ]; then
              clip_name=course_change
              if [ "$scene" = damage ]; then clip_name=health_state_change; fi
              ffmpeg -y -hide_banner -loglevel error -framerate 20 -i releases/M3057/captures/$scene/motion_%03d.png -vf 'scale=960:-2' -c:v libx264 -crf 28 -pix_fmt yuv420p -movflags +faststart releases/M3057/captures/$scene/$clip_name.mp4
              rm releases/M3057/captures/$scene/motion_*.png
            fi
          done
          for page in 0 1 2 3 4; do
            XDG_DATA_HOME="$(mktemp -d)" xvfb-run -a --server-args='-screen 0 1600x2304x24' /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path rebuild/m3052 --script tests/ship_render_capture.gd -- --out="$GITHUB_WORKSPACE/releases/M3057/captures/ship-audit" "--page=$page" > "releases/M3057/captures/ship-audit-$page.log" 2>&1 || { cat "releases/M3057/captures/ship-audit-$page.log"; exit 1; }
            cat "releases/M3057/captures/ship-audit-$page.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "releases/M3057/captures/ship-audit-$page.log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Abyssal-Dominion-M3057-Android
          path: releases/M3057/
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Newer source exists; skipping outdated release.'
            exit 0
          fi
          cp releases/M3057/ABYSSAL_DOMINION_M3057_REBUILD_ARM64.apk "$RUNNER_TEMP/ABYSSAL_DOMINION_305702.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          M3057: Native Android background updater, start launcher and HAFEN → UPDATES PRÜFEN.
          Install this bootstrap APK once over M3056; keep the existing app and saved progress.
          Future APKs download through Android DownloadManager and require Android installation confirmation.
          Automated checks and runtime captures passed; physical Android upgrade/background acceptance remains pending.
          NOTES
          if gh release view abyssal-305702-android >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite immutable APK.'
            exit 1
          fi
          gh release create abyssal-305702-android "$RUNNER_TEMP/ABYSSAL_DOMINION_305702.apk" releases/M3057/latest.json --target "$GITHUB_SHA" --title 'Abyssal Dominion M3057 Android' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          curl -fL --retry 3 -o "$RUNNER_TEMP/served.apk" https://github.com/Broosskyy/Abyssal-Dominion-Beta/releases/download/abyssal-305702-android/ABYSSAL_DOMINION_305702.apk
          python3 -c 'import hashlib,json,os,pathlib; manifest=json.loads(pathlib.Path("releases/M3057/latest.json").read_text())["latest"]; apk=pathlib.Path(os.environ["RUNNER_TEMP"])/"served.apk"; assert apk.stat().st_size==manifest["bytes"] and hashlib.sha256(apk.read_bytes()).hexdigest()==manifest["sha256"]; print("ANONYMOUS_APK_DOWNLOAD_VERIFIED")'
          mkdir -p updates
          cp releases/M3057/latest.json updates/latest.json
      - name: Preserve verified APK in repository
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Newer source exists; artifact retained, skipping outdated APK commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f updates/latest.json
          git add -f updates/latest.json releases/M3057/*.apk releases/M3057/*.build.json releases/M3057/*.signature.txt releases/M3057/*.manifest.txt releases/M3057/*.android-xml.txt releases/M3057/latest.json releases/M3057/captures/
          git commit -m 'Preserve verified M3057 APK, native updater and UI captures [skip ci]'
          git push origin HEAD:main
