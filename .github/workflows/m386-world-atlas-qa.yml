name: M386 twenty-sea atlas QA
on:
  push:
    branches: [feat/m386-world-realm-atlas-foundation]
    paths:
      - 'rebuild/m3052/**'
      - '.github/workflows/m386-world-atlas-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rebuild/m3052
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse all project scripts
        shell: bash
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          XDG_DATA_HOME="$(mktemp -d)" "$engine" --headless --path rebuild/m3052 --editor --import --quit > /tmp/m386-import.log 2>&1 || { tail -120 /tmp/m386-import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/m386-import.log; then exit 1; fi
      - name: Validate twenty realms and unchanged real movement
        shell: bash
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for suite in m386_world_realm_catalog_test m376_unified_direct_sailing_test; do
            timeout 120s "$engine" --headless --path rebuild/m3052 --script "tests/${suite}.gd" > "/tmp/${suite}.log" 2>&1 || { tail -120 "/tmp/${suite}.log"; exit 1; }
            tail -35 "/tmp/${suite}.log"
            grep -q '"status":"PASS"' "/tmp/${suite}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "/tmp/${suite}.log"; then exit 1; fi
          done
