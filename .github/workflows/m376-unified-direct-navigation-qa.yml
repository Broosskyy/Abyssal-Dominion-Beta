name: M376 shared direct 2D-3D navigation QA
on:
  push:
    branches: ['fix/m376-unified-direct-2d-3d-sailing']
    paths:
      - 'rebuild/m3052/**'
      - '.github/workflows/m376-unified-direct-navigation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rebuild/m3052
            server
      - name: Download pinned Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import assets and parse scripts
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path rebuild/m3052 --quit > /tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Direct route, coastline, offline crossplay and gameplay regressions
        run: |
          set -euo pipefail
          for name in m376_unified_direct_sailing_test navigation_test classic_mode_test classic_course_test direct_crossplay_test classic_navigation_test sea_edges_test simulation_test progression_test; do
            echo "Running $name"
            XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --script "tests/$name.gd" > "/tmp/$name.log" 2>&1 || { tail -120 "/tmp/$name.log"; exit 1; }
            tail -8 "/tmp/$name.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|"status":"FAIL"' "/tmp/$name.log"; then exit 1; fi
          done
      - name: Start test world-server and verify network crossplay
        run: |
          set -euo pipefail
          python3 -m pip install -r server/requirements.txt
          python3 -m unittest discover -s server -v
          ABYSSAL_DATABASE="$RUNNER_TEMP/m376-crossplay.sqlite3" python3 server/world_server.py > "$RUNNER_TEMP/m376-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 -c 'import socket,time; time.sleep(1); socket.create_connection(("127.0.0.1",8787),timeout=5).close()'
          XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --script tests/network_client_test.gd > "$RUNNER_TEMP/m376-network.log" 2>&1 || { cat "$RUNNER_TEMP/m376-network.log"; exit 1; }
          cat "$RUNNER_TEMP/m376-network.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|"status":"FAIL"' "$RUNNER_TEMP/m376-network.log"; then exit 1; fi
