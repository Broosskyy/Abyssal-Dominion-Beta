name: M3097 adjust shipyard regression after fourth GLB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3097-fix-shipyard-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-expected-card-count:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            rebuild/m3052/tests/ui_test.gd
      - name: Use dynamic shipyard size instead of legacy hardcoded 30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rebuild/m3052/tests/ui_test.gd')
          source=p.read_text(encoding='utf-8')
          old='check(yard==30,"shipyard shows one card for each original and new test design")'
          new='check(yard==game.skins.size(),"shipyard shows one card for every available design")'
          if source.count(old)!=1:
              raise RuntimeError("Unexpected shipyard assertion; refusing blind rewrite")
          p.write_text(source.replace(old,new),encoding='utf-8')
          print("M3097 replaced old fixed count with dynamic shipyard-card assertion")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f rebuild/m3052/tests/ui_test.gd
          git commit -m 'test(m3097): account for Gemi11 in shipyard-card count'
          git fetch origin main
          git rebase origin/main
          git -c pack.window=0 push origin HEAD:main
