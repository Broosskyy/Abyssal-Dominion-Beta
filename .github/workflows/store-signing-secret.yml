name: Store signing keystore as secret
# One-time, manual: copies the keystore that currently lives only in the
# Actions cache into the ABYSSAL_ANDROID_KEYSTORE_BASE64 repository secret,
# without printing it. Requires a fine-grained token in SECRETS_ADMIN_TOKEN
# with "Secrets: Read and write" on this repository. Optionally writes an
# AES-256 encrypted backup artifact when BACKUP_PASSPHRASE is set.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/abyssal-test-signing
          key: m3052-private-debug-signing-v1
          fail-on-cache-miss: true
      - name: Verify and store
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::Set the SECRETS_ADMIN_TOKEN secret first (docs/SIGNING.md).'; exit 1; }
          signing="$HOME/.cache/abyssal-test-signing/debug.keystore"
          keytool -exportcert -alias androiddebugkey -keystore "$signing" -storepass android -file /tmp/certificate.der >/dev/null
          test "$(sha256sum /tmp/certificate.der | cut -d' ' -f1)" = 278a2899340d58b3db0aced5e0f306ebb121550bc34dc1e6948783424652fe3b
          base64 -w0 "$signing" | gh secret set ABYSSAL_ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          echo 'Stored ABYSSAL_ANDROID_KEYSTORE_BASE64.'
          if [ -n "$BACKUP_PASSPHRASE" ]; then
            mkdir -p backup
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$signing" -out backup/debug.keystore.enc -pass env:BACKUP_PASSPHRASE
            echo "decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in debug.keystore.enc -out debug.keystore" > backup/README.txt
            echo "HAS_BACKUP=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_BACKUP == 'true' }}
        with:
          name: encrypted-signing-backup
          path: backup/
          retention-days: 1
