name: Supabase beta branch validation
on:
  push:
    branches:
      - feature/supabase-auth-crossplay-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 -m compileall -q server
      - run: python3 -m unittest discover -s server -v

  godot-local-protocol-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rebuild/m3052
            server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r server/requirements.txt
      - name: Fetch pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 360 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot import and parse
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --import --quit > /tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Local account + crossplay protocol
        shell: bash
        run: |
          set -euo pipefail
          ABYSSAL_DATABASE="$RUNNER_TEMP/test.sqlite3" python3 server/world_server.py > /tmp/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --script tests/network_client_test.gd > /tmp/protocol.log 2>&1 || { cat /tmp/protocol.log; exit 1; }
          cat /tmp/protocol.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|"status":"FAIL"' /tmp/protocol.log; then exit 1; fi
