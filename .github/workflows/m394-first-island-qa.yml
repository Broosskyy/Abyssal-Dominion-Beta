name: M394 first approved island & sailing QA
on:
  push:
    branches: [feat/m394-first-a01-island-collision-test]
    paths:
      - 'rebuild/m3052/**'
      - 'server/**'
      - '.github/workflows/m394-first-island-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rebuild/m3052
            server
            updates/latest.json
      - name: Verify unchanged native bootstrap and mirrored source art
        run: |
          python3 rebuild/m3052/tools/release_plan.py
          python3 rebuild/m3052/tools/sync_m392_catalog.py --check
      - name: Test authoritative crossplay sea bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/abyssal-m388-server
          /tmp/abyssal-m388-server/bin/pip install -r server/requirements.txt
          /tmp/abyssal-m388-server/bin/python -m unittest discover -s server -v
      - name: Install free RGBA PNG validation dependency
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Verify thirty island IDs and fail-closed artist approval
        shell: bash
        run: |
          set -euo pipefail
          python3 rebuild/m3052/tools/validate_m392_islands.py --report /tmp/m392-islands.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/m392-islands.json').read_text())
          assert report['definitions']==30
          assert report['approved_png']+report['pending_png']==30
          assert report['approved_ids']==['A01'] and report['pending_png']==29
          print('M392 approved PNGs:',report['approved_png'],'(pending are NOT claimed as completed)')
          PY
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse all project scripts
        shell: bash
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          XDG_DATA_HOME="$(mktemp -d)" "$engine" --headless --path rebuild/m3052 --editor --import --quit > /tmp/m388-import.log 2>&1 || { tail -120 /tmp/m388-import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/m388-import.log; then exit 1; fi
      - name: Validate twenty realms and unchanged real movement
        shell: bash
        run: |
          set -euo pipefail
          engine=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for suite in m394_first_island_test m392_island_catalog_test m390_realm_visuals_test m389_realm_ecology_test m389_realm_mission_ui_test m388_playable_realm_test m388_playable_realm_ui_test m386_world_realm_catalog_test m386_world_atlas_ui_test m376_unified_direct_sailing_test sea_edges_test m385_deck_extension_equipment_test; do
            timeout 120s env XDG_DATA_HOME="$(mktemp -d)" "$engine" --headless --path rebuild/m3052 --script "tests/${suite}.gd" > "/tmp/${suite}.log" 2>&1 || { tail -120 "/tmp/${suite}.log"; exit 1; }
            tail -35 "/tmp/${suite}.log"
            grep -q '"status":"PASS"' "/tmp/${suite}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "/tmp/${suite}.log"; then exit 1; fi
          done
