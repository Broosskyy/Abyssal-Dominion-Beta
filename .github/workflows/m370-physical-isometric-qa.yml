name: M370 physical Seafight isometric 48x32 routing QA
on:
  push:
    branches: ['fix/m370-physical-isometric-seafight-routing']
    paths:
      - 'rebuild/m3052/**'
      - '.github/workflows/m370-physical-isometric-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rebuild/m3052
      - name: Download pinned Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import assets and parse scripts
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path rebuild/m3052 --quit > /tmp/import.log 2>&1 || { tail -100 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi
      # Private baked atlases are absent from the source checkout;
      # scene/asset QA must run with the complete signed content pack.
      - name: Headless movement, coast and crossplay physics regressions
        run: |
          set -euo pipefail
          for name in m370_physical_isometric_routing_test; do
            echo "Running $name"
            XDG_DATA_HOME="$(mktemp -d)" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path rebuild/m3052 --script "tests/$name.gd" > "/tmp/$name.log" 2>&1 || { tail -120 "/tmp/$name.log"; exit 1; }
            tail -8 "/tmp/$name.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|"status":"FAIL"' "/tmp/$name.log"; then exit 1; fi
          done
