<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071822">
<title>Abyssal Dominion</title>
<style>
:root{color-scheme:dark;--sea:#071822;--gold:#e1bd77;--ink:#ecf1eb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:system-ui,sans-serif}
#game{position:fixed;inset:0;background:var(--sea)}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#launch{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#164251,var(--sea) 72%)}
#launch[hidden],button[hidden]{display:none}.card{width:min(100%,440px);text-align:center}h1{font-family:Georgia,serif;font-size:clamp(26px,5vw,40px);letter-spacing:.07em;color:var(--gold);margin:12px 0}p{line-height:1.5;color:#bacbd0;margin:14px 0}
button{min-height:48px;border:1px solid #a88c55;border-radius:7px;padding:10px 20px;background:#193c46;color:var(--ink);font:600 16px system-ui;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #80e3dc;outline-offset:3px}.primary{display:block;width:100%;background:linear-gradient(#e1bd77,#ab7d38);color:#171a16;margin-top:20px}.secondary{background:transparent;border-color:#45616a;margin-top:10px;width:100%;font-size:14px}
progress{width:100%;height:12px;margin:12px 0 2px;accent-color:var(--gold)}#status{min-height:24px;font-size:14px}#hint{font-size:13px;min-height:20px}
#fullscreen{position:absolute;z-index:5;right:max(10px,env(safe-area-inset-right));top:48%;width:44px;height:44px;min-height:44px;padding:0;font-size:25px;background:#071822c9;color:var(--gold)}
#notice{position:absolute;z-index:12;top:max(55px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(90%,420px);padding:10px 14px;border-radius:6px;background:#071822ed;text-align:center;font-size:14px;pointer-events:none}#notice:empty{display:none}
@media(max-height:460px){#launch{padding:12px}.card{width:min(100%,480px)}h1{margin:4px 0;font-size:26px}p{margin:6px 0}.primary{margin-top:10px}.secondary{margin-top:6px}#hint{margin:5px 0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="game">
 <canvas id="canvas" tabindex="0" aria-label="Abyssal Dominion Seekarte">Dein Browser unterstützt diese Seekarte nicht.</canvas>
 <section id="launch" aria-label="Spiel starten">
  <div class="card">
   <h1>ABYSSAL DOMINION</h1>
   <p>Dein nächstes Abenteuer wartet auf See.</p>
   <progress id="progress" aria-label="Spieldownload"></progress>
   <div id="status" role="status" aria-live="polite">Seekarte wird vorbereitet …</div>
   <button id="start" class="primary" type="button">Im Vollbild spielen</button>
   <button id="windowed" class="secondary" type="button">Im Browserfenster spielen</button>
   <p id="hint">Auf dem Handy am besten im Querformat.</p>
   <button id="retry" class="secondary" type="button" hidden>Erneut laden</button>
  </div>
 </section>
 <button id="fullscreen" type="button" title="Vollbild einschalten" aria-label="Vollbild einschalten" hidden>⛶</button>
 <div id="notice" role="status" aria-live="polite"></div>
</main>
<script src="$GODOT_URL"></script>
<script>
(() => {
 'use strict';
 const config = $GODOT_CONFIG;
 const game = document.getElementById('game');
 const canvas = document.getElementById('canvas');
 const launch = document.getElementById('launch');
 const status = document.getElementById('status');
 const progress = document.getElementById('progress');
 const start = document.getElementById('start');
 const windowed = document.getElementById('windowed');
 const fullscreen = document.getElementById('fullscreen');
 const retry = document.getElementById('retry');
 const notice = document.getElementById('notice');
 let ready = false, chosen = false, failed = false, noticeTimer;
 const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
 function tell(message) { clearTimeout(noticeTimer); notice.textContent = message; noticeTimer = setTimeout(() => { notice.textContent = ''; }, 6500); }
 function reveal() {
  if (!ready || !chosen || failed) return;
  launch.hidden = true; fullscreen.hidden = false;
  canvas.focus({preventScroll:true}); window.dispatchEvent(new Event('resize'));
 }
 async function enterFullscreen() {
  try {
   const request = game.requestFullscreen || game.webkitRequestFullscreen;
   if (!request) { tell('Vollbild ist hier nicht verfügbar. Du kannst im Browser weiterspielen.'); return; }
   await request.call(game);
   if (screen.orientation && screen.orientation.lock) {
    try { await screen.orientation.lock('landscape'); } catch (_) { /* Rotation remains available on unsupported devices. */ }
   }
  } catch (_) { tell('Vollbild wurde vom Browser nicht geöffnet. Tippe rechts auf ⛶, um es erneut zu versuchen.'); }
 }
 // Fullscreen MUST be requested inside the click, before awaiting engine boot.
 start.addEventListener('click', () => { chosen = true; enterFullscreen(); start.textContent = 'Seekarte wird geladen …'; reveal(); });
 windowed.addEventListener('click', () => { chosen = true; reveal(); });
 fullscreen.addEventListener('click', async () => {
  if (fullscreenElement()) {
   const exit = document.exitFullscreen || document.webkitExitFullscreen;
   try { if (exit) await exit.call(document); } catch (_) { tell('Nutze die Zurück-Taste, um das Vollbild zu verlassen.'); }
  } else await enterFullscreen();
  updateFullscreen(); canvas.focus({preventScroll:true});
 });
 function updateFullscreen() {
  const label = fullscreenElement() ? 'Vollbild verlassen' : 'Vollbild einschalten';
  fullscreen.title = label; fullscreen.setAttribute('aria-label', label);
  window.dispatchEvent(new Event('resize'));
 }
 document.addEventListener('fullscreenchange', updateFullscreen);
 document.addEventListener('webkitfullscreenchange', updateFullscreen);
 retry.addEventListener('click', () => location.reload());
 function failure(error) {
  failed = true; launch.hidden = false; progress.hidden = true;
  status.textContent = 'Die Seekarte konnte nicht geladen werden. Bitte prüfe deine Verbindung und versuche es erneut.';
  start.hidden = true; windowed.hidden = true; retry.hidden = false;
  console.error('Abyssal browser start failed:', error);
 }
 try {
  const engine = new Engine(config);
  // Download immediately while the captain chooses fullscreen. No extra load screen.
  engine.startGame({canvas, canvasResizePolicy:2, onProgress:(current,total) => {
   const mb = (current / 1048576).toFixed(1);
   if (total > 0) {
    progress.max = total; progress.value = current;
    status.textContent = current < total ? `Spieldaten laden · ${Math.floor(current/total*100)} % · ${mb} MB` : 'Schiffe und Seekarte werden vorbereitet …';
   } else { progress.removeAttribute('value'); status.textContent = `Spieldaten laden · ${mb} MB`; }
  }}).then(() => {
   ready = true; progress.max = 1; progress.value = 1; status.textContent = 'Bereit zum Ablegen';
   start.textContent = 'Im Vollbild spielen'; reveal();
  }).catch(failure);
 } catch (error) { failure(error); }
})();
</script>
</body>
</html>
