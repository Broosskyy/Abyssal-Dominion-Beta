<!-- jagged shore, pebbles, patches of moss -->
<path d="M97 350 L138 311 L173 291 L201 236 L271 223 L323 180 L423 188 L489 219 L523 272 L544 320 L504 369 L477 417 L405 469 L315 479 L235 447 L159 412 Z" fill="url(#sand)" stroke="#c5c3ae" stroke-opacity=".45" stroke-width="5"/>
<path d="M120 325 L154 293 L213 262 L255 228 L311 214 L358 192 L444 217 L485 254 L472 318 L453 358 L386 423 L304 448 L237 419 L177 384 Z" fill="#485950" opacity=".5"/>
