</g>
<!-- warehouse body, slate roof: dark realistic material effect -->
<path d="M254 293 L353 252 L420 285 L415 351 L326 389 L256 355 Z" fill="#272c2d" stroke="#28373a" stroke-width="8"/>
<path d="M247 276 L353 228 L429 276 L320 328 Z" fill="url(#roof)" stroke="#141d25" stroke-width="10" stroke-linejoin="round"/>
<path d="M247 277 L318 331 L320 389 L253 353 Z" fill="#4e5750" stroke="#263231" stroke-width="6"/>
