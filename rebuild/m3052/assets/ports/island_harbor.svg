<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<!-- Abyssal Dominion: original reusable ISLAND HARBOR sprite, top-down/2.5D.
     Transparent beyond the shore. Dock berth is at pixel (790,442).
     No island names, no gameplay indicators and no baked sea background. -->
<defs>
 <linearGradient id="sand" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#9c9782"/><stop offset=".4" stop-color="#666b62"/><stop offset="1" stop-color="#454e50"/></linearGradient>
 <linearGradient id="stone" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#aeb8b0"/><stop offset=".45" stop-color="#646e71"/><stop offset="1" stop-color="#283c42"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#66717a"/><stop offset=".45" stop-color="#394852"/><stop offset="1" stop-color="#172831"/></linearGradient>
 <linearGradient id="pier" x1=".2" y1="0" x2=".5" y2="1"><stop stop-color="#ba9965"/><stop offset=".5" stop-color="#6c513a"/><stop offset="1" stop-color="#362d2a"/></linearGradient>
 <radialGradient id="foam"><stop stop-color="#a6f4e7" stop-opacity=".15"/><stop offset="1" stop-color="#c5ffed" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamplight"><stop stop-color="#fff2ae" stop-opacity=".85"/><stop offset=".25" stop-color="#f2c35d" stop-opacity=".38"/><stop offset="1" stop-color="#ecb256" stop-opacity="0"/></radialGradient>
</defs>
<!-- Calm contact shadow and transparent sea foam: no flat ocean rectangle -->
<ellipse cx="374" cy="388" rx="320" ry="194" fill="#001b25" opacity=".21"/>
<path d="M57 334 Q73 268 135 246 L171 184 L261 158 L325 117 L437 131 L513 170 L572 241 L607 305 L579 394 L508 482 L429 528 L310 544 L215 507 L120 454 Z" fill="url(#foam)" stroke="#ddfff4" stroke-opacity=".46" stroke-width="9" stroke-linejoin="round"/>
