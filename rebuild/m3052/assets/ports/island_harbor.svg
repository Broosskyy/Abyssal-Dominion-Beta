</g>
<!-- harbor lanterns -->
<g>
 <circle cx="560" cy="332" r="40" fill="url(#lamplight)"/><circle cx="692" cy="368" r="40" fill="url(#lamplight)"/><circle cx="766" cy="430" r="36" fill="url(#lamplight)"/>
 <path d="M558 349v-18 M690 380v-18 M764 441v-17" stroke="#272c2f" stroke-width="7"/>
 <circle cx="559" cy="332" r="6" fill="#ffdb83"/><circle cx="691" cy="364" r="6" fill="#ffdc85"/><circle cx="764" cy="427" r="6" fill="#ffe19a"/>
</g>
<!-- barrels, crates, rope coils and mooring bollards -->
<g stroke="#3c3429" stroke-width="3">
 <rect x="430" y="355" width="19" height="16" rx="2" fill="#96774e" transform="rotate(-19 440 363)"/>
 <rect x="449" y="364" width="22" height="19" rx="2" fill="#725236" transform="rotate(-13 459 373)"/>
 <ellipse cx="502" cy="373" rx="9" ry="12" fill="#8d6841"/>
 <ellipse cx="517" cy="377" rx="9" ry="12" fill="#ab8558"/>
 <path d="M586 383 q14 -10 19 3 q4 14 -12 12 q-12 -5 -7 -15" fill="none" stroke="#d7c49a" stroke-width="4"/>
</g>
<!-- isolated docking-water compass, mild glows, no large fake neon disk -->
<ellipse cx="804" cy="446" rx="82" ry="39" fill="#001d2c" opacity=".14"/>
<ellipse cx="802" cy="442" rx="50" ry="23" fill="none" stroke="#c9eee7" stroke-width="4" stroke-opacity=".76" stroke-dasharray="28 12 7 9"/>
<path d="M802 426v25 M790 442h24 M795 453q7 10 14 0" stroke="#ebd8a5" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="802" cy="432" r="5" fill="none" stroke="#ebd8a5" stroke-width="3"/>
<!-- microscopic shoreline flecks preserve transparency beyond the island -->
<g stroke="#d7fff5" opacity=".5" stroke-width="3" stroke-linecap="round">
 <path d="M87 354l-15 12 M157 474l-20 6 M284 535l-19 4 M414 535l-20 4 M535 458l20-8 M561 275l10 13"/>
</g>
</svg>